<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>خميسنا غير وحضورك يفرق</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f7f9fc;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #557795, #9bb8d3);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: 38px;
    }

    header p {
      margin: 0;
      font-size: 21px;
    }

    section {
      max-width: 1050px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .intro {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
      line-height: 2;
    }

    h2 {
      text-align: center;
      color: #557795;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: transform 0.25s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    .video-box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    video {
      width: 100%;
      max-height: 600px;
      border-radius: 15px;
      display: block;
    }

    .closing {
      text-align: center;
      font-size: 20px;
      line-height: 2;
      color: #557795;
    }

    footer {
      margin-top: 60px;
      padding: 30px 20px;
      background: #557795;
      color: white;
      text-align: center;
      font-size: 17px;
    }

    @media (max-width: 600px) {
      header {
        padding: 45px 15px;
      }

      header h1 {
        font-size: 29px;
      }

      header p {
        font-size: 18px;
      }

      section {
        margin: 30px auto;
      }

      .gallery {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .gallery img {
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>خميسنا غير وحضورك يفرق</h1>
    
    <p>متوسطة الليث بن سعد</p>

  </header>

  <section>
    <div class="intro">
      <h2>🌟 عن المبادرة</h2>

      <p>
        نشارككم صورًا من مبادرة
        <strong>خميسنا غير وحضورك يفرق</strong>،
        توثيقًا للفعاليات والأنشطة التي أُقيمت ضمن المبادرة.
      </p>
    </div>
  </section>

  <section>
    <h2>📸 صور المبادرة</h2>

    <div class="gallery">

      <img src="1.jpeg" alt="شاهد من المبادرة">
      <img src="2.jpeg" alt="شاهد من المبادرة">
      <img src="3.jpeg" alt="شاهد من المبادرة">
      <img src="4.jpeg" alt="شاهد من المبادرة">

    </div>
  </section>

  <section>
    <h2>🎥 فيديو المبادرة</h2>

    <div class="video-box">

      <video controls>
        <source src="khameesna-video.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>

    </div>
  </section>

  <section>
    <div class="closing">
      <p>
        حضوركم يفرق، و به يستمر العطاء ✨
      </p>
    </div>
  </section>

  <footer>
    مبادرة خميسنا غير وحضورك يفرق
  </footer>

</body>
</html>
